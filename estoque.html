<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - T-PACE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- TOPBAR COM NAVEGAÇÃO -->
    <!-- TOPBAR COM NAVEGAÇÃO -->
    <header class="topbar">
        <!-- Logo -->
        <div class="topbar-brand">T-PACE</div>
        
        <!-- Botão Hamburger (Aparece só no celular) -->
        <button class="mobile-menu-btn" onclick="toggleMenuMobile()">
            <span></span><span></span><span></span>
        </button>

        <!-- Menu Principal (Fica oculto no celular até clicar) -->
        <nav class="topbar-menu">
            <a href="dashboard.html" class="menu-link" title="Dashboard">
                <img src="assets/icons/dashboard.png" alt="Dashboard" class="nav-icon">
            </a>
            <a href="relatorios.html" class="menu-link" title="Relatórios">
                <img src="assets/icons/relatorio.png" alt="Relatórios" class="nav-icon">
            </a>
            <a href="usuarios.html" class="menu-link" title="Usuários">
                <img src="assets/icons/usuario.png" alt="Usuários" class="nav-icon">
            </a>
            <a href="estoque.html" class="menu-link active" title="Controle de Estoque">
                <img src="assets/icons/estoque.png" alt="Estoque" class="nav-icon">
            </a>
            <a href="index.html" id="btn-sair" class="menu-link" title="Sair">
                <img src="assets/icons/sair.png" alt="Sair" class="nav-icon">
            </a>
        </nav>

        <div class="topbar-divider"></div>

        <!-- Usuário -->
        <div class="user-info">
            <span>Carregando...</span>
        </div>
    </header>

    <main class="main-content">
        <!-- CONTEÚDO DA TELA: ESTOQUE -->
        <section class="screen-container">
            <h2>Gerenciar Estoque</h2>
            
            <!-- TOOLBAR COM BOTÕES -->
            <div class="toolbar">
                <input type="text" id="inputPesquisa" placeholder="Pesquisar produto por nome ou código..." style="width: 300px;">
                <div>
                    <button class="btn btn-outline" style="margin-right: 10px;">Exportar Relatório</button>
                    <!-- O botão que abre a janelinha modal -->
                    <button class="btn" onclick="abrirModalNovo()">+ Adicionar Produto</button>
                </div>
            </div>

            <!-- ESTRUTURA DA TABELA -->
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Qtd.</th>
                        <th>Preço Unit.</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <!-- É aqui que o JS vai injetar os produtos -->
                <tbody id="tabela-estoque">
                    <tr>
                        <td colspan="7" style="text-align: center;">Carregando...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- ========================================== -->
    <!-- JANELA MODAL OCULTA (ADICIONAR/EDITAR)     -->
    <!-- ========================================== -->
    <div class="modal-overlay" id="modal-produto">
        <div class="modal-glass">
            <div class="modal-header">
                <h3 id="modal-titulo">Adicionar Produto</h3>
                <button class="modal-close" onclick="fecharModal()">&times;</button>
            </div>
            
            <form id="form-produto">
                <input type="hidden" id="prod-id">
                
                <div class="form-grid">
                    <!-- Linha 1 -->
                    <div class="form-group full-width">
                        <label>Nome do Produto *</label>
                        <input type="text" id="prod-nome" required>
                    </div>
                    
                    <!-- Linha 2 -->
                    <div class="form-group">
                        <label>Código de Barras</label>
                        <input type="text" id="prod-codigo">
                    </div>
                    <div class="form-group">
                        <label>Unid. Venda *</label>
                        <select id="prod-unidade">
                            <option value="Un">Unidade</option>
                            <option value="Kg">Quilograma</option>
                            <option value="L">Litro</option>
                            <option value="Cx">Caixa</option>
                            <option value="Mt">Metro</option>
                            <option value="G">Grama</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Em Promoção?</label>
                        <select id="prod-em-promocao">
                            <option value="0">Não</option>
                            <option value="1">Sim</option>
                        </select>
                    </div>

                    <!-- Linha 3 -->
                    <div class="form-group">
                        <label>Custo (R$)</label>
                        <input type="number" step="0.01" id="prod-custo">
                    </div>
                    <div class="form-group">
                        <label>Preço Venda (R$) *</label>
                        <input type="number" step="0.01" id="prod-preco" required>
                    </div>
                    <div class="form-group">
                        <label>Preço Promocional (R$)</label>
                        <input type="number" step="0.01" id="prod-promocional">
                    </div>

                    <!-- Linha 4 -->
                    <div class="form-group">
                        <label>Qtd Atual *</label>
                        <input type="number" step="0.001" id="prod-qtd" required>
                    </div>
                    <div class="form-group">
                        <label>Qtd Mínima *</label>
                        <input type="number" step="0.001" id="prod-minimo" required>
                    </div>
                    <div class="form-group">
                        <label>Alíquota Imposto (%)</label>
                        <input type="number" step="0.01" id="prod-imposto">
                    </div>

                    <!-- Linha 5 -->
                    <div class="form-group">
                        <label>NCM</label>
                        <input type="text" id="prod-ncm">
                    </div>
                    <div class="form-group">
                        <label>CEST</label>
                        <input type="text" id="prod-cest">
                    </div>
                    <div class="form-group">
                        <label>Lote</label>
                        <input type="text" id="prod-lote">
                    </div>

                    <!-- Linha 6 -->
                    <div class="form-group">
                        <label>Validade</label>
                        <input type="date" id="prod-validade">
                    </div>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Controle de Permissões e Logout -->
    <script src="js/permissoes.js"></script>
    <!-- Script que puxa os produtos do banco e controla o modal -->
    <script src="js/estoque.js"></script>
</body>
</html>
