<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - T-PACE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- TOPBAR COM NAVEGAÇÃO -->
    <header class="topbar">
        <!-- Logo -->
        <div class="topbar-brand">T-PACE</div>
        
        <!-- Pesquisa -->
        <div class="topbar-search">
            <input type="text" placeholder="Pesquisar no sistema...">
        </div>

        <!-- Menu Principal (Completo) -->
        <nav class="topbar-menu">
            <!-- 1. Dashboard -->
            <a href="dashboard.html" class="menu-link active" title="Dashboard">
                <img src="assets/icons/dashboard.png" alt="Dashboard" class="nav-icon">
            </a>
            <!-- 2. Relatórios -->
            <a href="relatorios.html" class="menu-link" title="Relatórios">
                <img src="assets/icons/relatorio.png" alt="Relatórios" class="nav-icon">
            </a>
            <!-- 3. Usuários -->
            <a href="usuarios.html" class="menu-link" title="Usuários">
                <img src="assets/icons/usuario.png" alt="Usuários" class="nav-icon">
            </a>
            <!-- 4. Estoque -->
            <a href="estoque.html" class="menu-link" title="Controle de Estoque">
                <img src="assets/icons/estoque.png" alt="Estoque" class="nav-icon">
            </a>
            <!-- 5. Sair (Sempre visível) -->
            <a href="index.html" id="btn-sair" class="menu-link" title="Sair">
                <img src="assets/icons/sair.png" alt="Sair" class="nav-icon">
            </a>
        </nav>
        
        <div class="topbar-divider"></div>

        <!-- Usuário -->
        <div class="user-info">
            <span>Operador 01</span>
        </div>
    </header>

    <main class="main-content">
        <!-- CONTEÚDO DA TELA: DASHBOARD -->
        <section class="screen-container">
            <h2>Resumo de Hoje</h2>
            
            <div class="dashboard-cards">
                <div class="card">
                    <div class="card-title">Vendas do Dia</div>
                    <div class="card-value" id="card-vendas">R$ 0,00</div>
                </div>
                <div class="card">
                    <div class="card-title">Atendimentos</div>
                    <div class="card-value" id="card-atendimentos">0</div>
                </div>
                <div class="card">
                    <div class="card-title">Alertas de Estoque</div>
                    <div class="card-value" id="card-alertas">0 itens</div>
                </div>
            </div>

            <div class="chart-placeholder">
                [ Área reservada para Gráfico de Faturamento ]
            </div>
        </section>
    </main>
    <!-- Script de Controle de Permissões e Logout -->
    <script src="js/permissoes.js"></script>
</body>
</html>
</body>
</html>
